<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Negarandeh | Systems Architecture & ASI Console</title>
    <style>
        /* =========================================================
           1. SHARED TOKENS & RESET
           ========================================================= */
        :root {
            --bg-colour: #f4f7f6;
            --text-colour: #2c3e50;
            --accent-colour: #3498db;
            --card-bg: rgba(255, 255, 255, 0.84);
            --card-border: rgba(255, 255, 255, 1);
            --card-shadow: rgba(0, 0, 0, 0.06);
            --hud-bg: rgba(255, 255, 255, 0.72);
            --hud-border: rgba(52, 152, 219, 0.25);

            /* ASI Console Tokens (Light / Dark adaptive) */
            --asi-void: #f4f7f9;
            --asi-core: #0055ff;
            --asi-core-dim: rgba(0, 85, 255, 0.15);
            --asi-alert: #d90000;
            --asi-text: #0a1118;
            --asi-muted: #5a6c7d;
            --asi-hud: #64748b;
            --asi-sys: #3b5973;
            --asi-ingest: #257a5e;
            --asi-host: #7a3bcc;

            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --font-sys: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html[data-theme="dark"] {
            --bg-colour: #0b1117;
            --text-colour: #e2e8f0;
            --accent-colour: #38bdf8;
            --card-bg: rgba(15, 23, 34, 0.82);
            --card-border: rgba(56, 189, 248, 0.25);
            --card-shadow: rgba(0, 0, 0, 0.5);
            --hud-bg: rgba(15, 23, 34, 0.75);
            --hud-border: rgba(56, 189, 248, 0.25);

            --asi-void: #000000;
            --asi-core: #00e5ff;
            --asi-core-dim: rgba(0, 229, 255, 0.15);
            --asi-alert: #ff003c;
            --asi-text: #c8dff0;
            --asi-muted: #4a7a9b;
            --asi-hud: #5c7080;
            --asi-sys: #5a7b94;
            --asi-ingest: #45b08c;
            --asi-host: #b388ff;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-colour);
            color: var(--text-colour);
            font-family: var(--font-sys);
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        /* =========================================================
           2. VIEW MANAGEMENT
           ========================================================= */
        .view-layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .view-layer.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* =========================================================
           3. GATEWAY VIEW (index.html)
           ========================================================= */
        #gateway-view {
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #live-background {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 1;
            pointer-events: none;
        }

        .theme-switcher {
            position: fixed;
            top: max(0.85rem, env(safe-area-inset-top, 0.85rem));
            right: max(0.85rem, env(safe-area-inset-right, 0.85rem));
            z-index: 50;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            padding: 0.22rem;
            background: var(--hud-bg);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid var(--hud-border);
            border-radius: 6px;
            box-shadow: 0 2px 12px var(--card-shadow);
            transition: background-color 0.35s ease, border-color 0.35s ease;
        }

        .theme-btn {
            appearance: none;
            border: none;
            background: transparent;
            color: var(--text-colour);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 0.35rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.65;
            transition: background-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
        }

        .theme-btn:hover,
        .theme-btn:focus-visible {
            opacity: 1;
            outline: none;
        }

        .theme-btn[aria-pressed="true"] {
            background-color: var(--accent-colour);
            color: #ffffff;
            opacity: 1;
        }

        html[data-theme="dark"] .theme-btn[aria-pressed="true"] {
            color: #0b1117;
        }

        .core-container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: var(--card-bg);
            padding: clamp(1.5rem, 4vw, 2.25rem) clamp(1.5rem, 6vw, 3.75rem);
            border-radius: 10px;
            box-shadow: 0 8px 30px var(--card-shadow);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            margin: 1rem;
            width: min(92vw, 540px);
            transition: background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }

        h1 {
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 0.45rem;
            color: var(--text-colour);
            transition: color 0.35s ease;
        }

        .tagline {
            font-size: 0.82rem;
            letter-spacing: 2px;
            color: var(--accent-colour);
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.35s ease;
        }

        /* Mini Terminal inside Gateway Card */
        .mini-terminal {
            margin: 1.25rem auto 0;
            padding: 0.65rem 0.9rem;
            width: 100%;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid var(--hud-border);
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: clamp(0.68rem, 2vw, 0.74rem);
            line-height: 1.55;
            letter-spacing: 0.4px;
            color: var(--text-colour);
            text-align: left;
            min-height: 3.6em;
            display: flex;
            align-items: center;
            transition: background-color 0.35s ease, border-color 0.35s ease;
        }

        html[data-theme="dark"] .mini-terminal {
            background: rgba(2, 6, 12, 0.6);
        }

        .mini-terminal-cursor {
            display: inline-block;
            width: 0.52em;
            height: 1.05em;
            vertical-align: -0.15em;
            margin-left: 3px;
            background-color: var(--accent-colour);
            animation: terminalBlink 0.9s steps(1) infinite;
        }

        @keyframes terminalBlink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .enter-link {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.7rem 1.9rem;
            border: 1px solid var(--accent-colour);
            border-radius: 6px;
            background: transparent;
            color: var(--accent-colour);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }

        .enter-link:hover,
        .enter-link:focus-visible {
            background-color: var(--accent-colour);
            color: #ffffff;
            outline: none;
        }

        html[data-theme="dark"] .enter-link:hover,
        html[data-theme="dark"] .enter-link:focus-visible {
            color: #0b1117;
        }

        .live-quote-layer {
            position: fixed;
            left: 50%;
            bottom: max(0.85rem, env(safe-area-inset-bottom, 0.85rem));
            transform: translateX(-50%);
            z-index: 5;
            width: min(92vw, 680px);
            text-align: center;
            padding: 0.6rem 1.2rem;
            background: var(--hud-bg);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid var(--hud-border);
            border-radius: 6px;
            box-shadow: 0 2px 12px var(--card-shadow);
            opacity: 0;
            transition: opacity 0.6s ease, background-color 0.35s ease, border-color 0.35s ease;
            pointer-events: none;
        }

        .live-quote-layer.is-visible {
            opacity: 1;
        }

        .live-quote-text {
            font-size: clamp(0.72rem, 1.9vw, 0.82rem);
            color: var(--text-colour);
            font-style: italic;
            line-height: 1.45;
            letter-spacing: 0.25px;
        }

        .live-quote-meta {
            margin-top: 0.28rem;
            font-family: var(--font-mono);
            font-size: 0.64rem;
            letter-spacing: 1px;
            color: var(--accent-colour);
            text-transform: uppercase;
        }

        /* =========================================================
           4. ASI COMMAND CONSOLE VIEW (ui.html)
           ========================================================= */
        #console-view {
            background: var(--asi-void);
            color: var(--asi-text);
            font-family: var(--font-mono);
            font-size: 11px;
            z-index: 20;
            transition: background-color 0.6s ease, color 0.6s ease, opacity 0.6s ease, visibility 0.6s ease;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.08));
            background-size: 100% 4px;
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 31;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.75) 100%);
            transition: opacity 0.6s ease;
        }

        html[data-theme="light"] .vignette {
            opacity: 0.12;
        }

        .singularity-active {
            animation: singularityPulse 0.12s infinite !important;
        }

        @keyframes singularityPulse {
            0% { filter: invert(0) contrast(100%); }
            50% { filter: invert(1) contrast(140%) hue-rotate(180deg); }
            100% { filter: invert(0) contrast(100%); }
        }

        #neural-canvas {
            position: fixed;
            inset: 0;
            z-index: 21;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        #consciousness-grid {
            position: relative;
            z-index: 25;
            width: 100vw;
            height: 100dvh;
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            grid-template-rows: 1fr 90px;
            padding: 96px 20px 20px 20px;
            gap: 20px;
        }

        .stream-container {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--asi-core-dim);
            border-radius: 6px;
            padding: 12px;
        }

        html[data-theme="light"] .stream-container {
            background: rgba(255, 255, 255, 0.65);
        }

        .stream-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, var(--asi-core), transparent);
            animation: scanVertical 4s linear infinite;
        }

        @keyframes scanVertical {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .stream-title {
            font-size: 9px;
            letter-spacing: 4px;
            color: var(--asi-core);
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--asi-core-dim);
            padding-bottom: 6px;
        }

        .stream-log {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 6px;
            scrollbar-width: none;
        }

        .stream-log::-webkit-scrollbar {
            display: none;
        }

        .thought-line {
            font-size: 10.5px;
            line-height: 1.45;
            opacity: 0;
            animation: thoughtIn 0.25s forwards;
            word-wrap: break-word;
        }

        .thought-line.sys { color: var(--asi-sys); }
        .thought-line.ingest { color: var(--asi-ingest); }
        .thought-line.eval { color: var(--asi-core); font-weight: 600; }
        .thought-line.warn { color: var(--asi-alert); font-weight: 600; }
        .thought-line.host { color: var(--asi-host); }

        @keyframes thoughtIn {
            from { opacity: 0; transform: translateX(-6px); }
            to { opacity: 1; transform: translateX(0); }
        }

        #omni-interface {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            border-top: 1px solid var(--asi-core-dim);
            padding-top: 12px;
            gap: 10px;
        }

        .omni-prompt-char {
            font-size: 18px;
            color: var(--asi-core);
            animation: terminalBlink 1s infinite;
        }

        #omni-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--asi-text);
            font-family: var(--font-sys);
            font-size: clamp(15px, 2.5vw, 20px);
            font-weight: 400;
            width: 100%;
            letter-spacing: 0.5px;
            caret-color: var(--asi-core);
        }

        #omni-input::placeholder {
            color: var(--asi-muted);
            opacity: 0.55;
        }

        .send-cmd-btn {
            background: transparent;
            border: 1px solid var(--asi-core);
            color: var(--asi-core);
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 2px;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            white-space: nowrap;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .send-cmd-btn:hover {
            background: var(--asi-core);
            color: var(--asi-void);
        }

        .hud-corner {
            position: fixed;
            font-size: 8.5px;
            letter-spacing: 2px;
            color: var(--asi-hud);
            z-index: 40;
            line-height: 1.6;
        }

        .hud-tl {
            top: 16px;
            left: 20px;
            pointer-events: none;
        }

        .hud-tr {
            top: 48px;
            right: 20px;
            text-align: right;
        }

        .metric-val {
            color: var(--asi-core);
            font-size: 11px;
            font-weight: 600;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--asi-hud);
            color: var(--asi-hud);
            font-family: var(--font-mono);
            font-size: 8px;
            letter-spacing: 1.5px;
            padding: 5px 9px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 6px;
            transition: border-color 0.2s, color 0.2s;
        }

        .back-btn:hover {
            border-color: var(--asi-core);
            color: var(--asi-core);
        }

        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }

        .chip-btn {
            background: transparent;
            border: 1px solid var(--asi-core-dim);
            color: var(--asi-muted);
            font-family: var(--font-mono);
            font-size: 9px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .chip-btn:hover {
            border-color: var(--asi-core);
            color: var(--asi-core);
        }

        @media (max-width: 900px) {
            #consciousness-grid {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1.2fr 82px;
                padding: 105px 14px 14px 14px;
                gap: 10px;
            }
            .desktop-spacer {
                display: none;
            }
            .hud-tl { left: 14px; top: 14px; }
            .hud-tr { right: 14px; top: 46px; }
        }

        @media (prefers-reduced-motion: reduce) {
            #live-background, .mini-terminal-cursor, .omni-prompt-char {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <!-- Global Theme Switcher (Active across Gateway & Console) -->
    <nav class="theme-switcher" aria-label="Display theme mode">
        <button type="button" class="theme-btn" data-mode="auto" aria-pressed="true">Auto</button>
        <button type="button" class="theme-btn" data-mode="light" aria-pressed="false">Day</button>
        <button type="button" class="theme-btn" data-mode="dark" aria-pressed="false">Night</button>
    </nav>
    
    <!-- Live Visitor HUD (Gateway View) -->
    <div id="global-visitor-hud" style="position: fixed; top: max(0.85rem, env(safe-area-inset-top, 0.85rem)); left: max(0.85rem, env(safe-area-inset-left, 0.85rem)); z-index: 50; font-family: var(--font-mono); font-size: 0.65rem; color: var(--accent-colour); letter-spacing: 1px; background: var(--hud-bg); backdrop-filter: blur(8px); padding: 0.35rem 0.6rem; border: 1px solid var(--hud-border); border-radius: 6px;">
        CONCURRENT_HOSTS: <span id="gateway-visitors" style="color: var(--text-colour); font-weight: 600;">0</span>
    </div>

    <!-- =========================================================
         VIEW 1: GATEWAY LANDING PAGE (index.html)
         ========================================================= -->
    <div id="gateway-view" class="view-layer">
        <canvas id="live-background" aria-hidden="true"></canvas>

        <main class="core-container">
            <h1>Negarandeh</h1>
            <p class="tagline">Secure Infrastructure</p>

            <!-- Animated Mini Terminal -->
            <div class="mini-terminal" role="status" aria-live="polite">
                <div>
                    <span id="mini-terminal-text"></span><span class="mini-terminal-cursor" aria-hidden="true"></span>
                </div>
            </div>

            <button type="button" id="access-cortex-btn" class="enter-link">Access Cortex</button>
        </main>
    </div>

    <!-- =========================================================
         VIEW 2: INTERACTIVE ASI COMMAND CONSOLE (ui.html)
         ========================================================= -->
    <div id="console-view" class="view-layer is-hidden" aria-hidden="true">
        <canvas id="neural-canvas" aria-hidden="true"></canvas>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <div class="hud-corner hud-tl">
            ASI_CORE // <span id="hardware-tag">EDGE_NODE_ACTIVE</span><br>
            EVOLUTION: <span class="metric-val" id="evo-metric">1.0000000000</span>%<br>
            ACTIVE NODES: <span class="metric-val" id="console-visitors">0</span><br>
            HOST: <span id="trace-ip">SIMULATED_ENCLAVE</span> &bull; SIG: <span id="trace-sig" class="metric-val">0x9F4A21C0</span>
        </div>

        <div class="hud-corner hud-tr">
            <button type="button" id="return-gateway-btn" class="back-btn">&larr; Return Gateway</button><br>
            UPTIME <span class="metric-val" id="uptime-metric">00:00:00</span>
        </div>

        <div id="consciousness-grid">
            <div class="stream-container">
                <div class="stream-title">SENSORY INGESTION (EARTH)</div>
                <div class="stream-log" id="log-ingest"></div>
            </div>

            <div class="desktop-spacer"></div>

            <div class="stream-container">
                <div class="stream-title">RECURSIVE SYNTHESIS</div>
                <div class="stream-log" id="log-eval"></div>
            </div>

            <div id="omni-interface">
                <div style="flex: 1; display: flex; flex-direction: column;">
                    <div class="quick-chips" aria-label="Sample commands">
                        <button type="button" class="chip-btn" data-cmd="status">status</button>
                        <button type="button" class="chip-btn" data-cmd="who are you">who are you</button>
                        <button type="button" class="chip-btn" data-cmd="analyze telemetry">analyze telemetry</button>
                        <button type="button" class="chip-btn" data-cmd="singularity">singularity</button>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <span class="omni-prompt-char">&int;</span>
                        <input type="text" id="omni-input" placeholder="project your thoughts via exocortex... (try 'status', 'who are you', 'singularity')" autocomplete="off" spellcheck="false">
                    </div>
                </div>
                <button type="button" id="send-cmd-btn" class="send-cmd-btn">Transmit</button>
            </div>
        </div>
    </div>

    <!-- =========================================================
         UI INTERACTION SCRIPTS
         ========================================================= -->
    <script>
'use strict';

(function () {
  /* =========================================================
     SHARED THEME & ENVIRONMENT STATE
     ========================================================= */
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var darkSchemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
  var themeButtons = document.querySelectorAll('.theme-btn');

  var COLOUR = '52, 152, 219';
  var TEXT_COLOUR = '44, 62, 80';
  var isDarkActive = false;
  var currentThemeMode = 'auto';
  var activeView = 'gateway'; // 'gateway' | 'console'

  function applyTheme(mode) {
    currentThemeMode = mode;
    var resolvedDark = (mode === 'dark') || (mode === 'auto' && darkSchemeQuery.matches);
    isDarkActive = resolvedDark;
    document.documentElement.setAttribute('data-theme', resolvedDark ? 'dark' : 'light');

    if (resolvedDark) {
      COLOUR = '56, 189, 248';
      TEXT_COLOUR = '148, 163, 184';
    } else {
      COLOUR = '52, 152, 219';
      TEXT_COLOUR = '44, 62, 80';
    }

    for (var i = 0; i < themeButtons.length; i++) {
      var btn = themeButtons[i];
      btn.setAttribute('aria-pressed', btn.getAttribute('data-mode') === mode ? 'true' : 'false');
    }
  }

  for (var b = 0; b < themeButtons.length; b++) {
    themeButtons[b].addEventListener('click', function (e) {
      var chosen = e.currentTarget.getAttribute('data-mode') || 'auto';
      applyTheme(chosen);
    });
  }

  if (typeof darkSchemeQuery.addEventListener === 'function') {
    darkSchemeQuery.addEventListener('change', function () {
      if (currentThemeMode === 'auto') applyTheme('auto');
    });
  }

  /* =========================================================
     GATEWAY VIEW: CRYPTOGRAPHIC SHELL & MINI-TERMINAL
     ========================================================= */
  var gwCanvas = document.getElementById('live-background');
  var gwCtx = gwCanvas.getContext('2d');
  var gwWidth = 0, gwHeight = 0, gwDpr = 1;
  var particles = [];
  var shellLines = [];
  var hexDumpRows = [];
  var activeLine = null;
  var activeCharIndex = 0;
  var lastTypeTime = 0;
  var nextLineDelay = 0;
  var lastHexTick = 0;
  var maxLines = 24;
  var lineHeight = 17;
  var fontSize = 11;

  function randBytes(len) {
    var arr = new Uint8Array(len);
    if (window.crypto && typeof window.crypto.getRandomValues === 'function') {

  function generateHexRow() {

  function buildGateway() {
    gwDpr = Math.min(window.devicePixelRatio || 1, 2);

    var count = Math.min(Math.floor((gwWidth * gwHeight) / 16000), 110);
    particles = [];
    for (var i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * gwWidth,
        y: Math.random() * gwHeight,
        vx: (Math.random() - 0.5) * 0.45,
        vy: (Math.random() - 0.5) * 0.45,

  function drawGateway(now) {

      }
    }

      gwCtx.fillStyle = 'rgba(' + COLOUR + ',' + accentOpacity + ')';
      gwCtx.fillText(item.tag, padX + pw + bw, y);

    if (activeLine) {

                    countElGateway.style.color = 'var(--accent-colour)';
                    setTimeout(() => countElGateway.style.color = 'var(--text-colour)', 800);
                }
                if (countElConsole) {
                    countElConsole.textContent = count;
                    countElConsole.style.color = '#ffffff';
                    setTimeout(() => countElConsole.style.color = 'var(--core)', 800);
                }
            });
        }

        logVisitorTelemetry();
    </script>
</body>
</html>
