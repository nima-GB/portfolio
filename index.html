<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Negarandeh | Systems Architecture</title>
    <meta name="description" content="Secure, lightweight operational terminal.">
    <meta name="robots" content="noindex, nofollow"> <!-- Hardened: Removed from search indexing -->

    <!-- Hardened Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests; base-uri 'none';">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-store, max-age=0, must-revalidate">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <style>
        /* Ultra-light, bright theme */
        :root {
            --bg-colour: #f4f7f6;
            --text-colour: #2c3e50;
            --accent-colour: #3498db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-colour);
            color: var(--text-colour);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden; /* Prevents scrollbars from the canvas */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Live Background Canvas */
        #live-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none; /* Let clicks pass through */
        }

        /* Minimal Centred Content */
        .core-container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 2rem 4rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 1);
        }

        h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: var(--text-colour);
        }

        p {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--accent-colour);
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

    <!-- Self-contained live background -->
    <canvas id="live-background"></canvas>

    <!-- Minimal, clean interface -->
    <main class="core-container">
        <h1>Negarandeh</h1>
        <p>Secure Infrastructure</p>
    </main>

    <script>
        // Bright, lightweight neural/particle animation
        const canvas = document.getElementById('live-background');
        const ctx = canvas.getContext('2d');

        let width, height, particles;

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            // Adjust particle count based on screen size to keep it light
            const particleCount = Math.floor((width * height) / 15000);

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    radius: Math.random() * 2 + 1
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = '#3498db';
            ctx.lineWidth = 0.5;

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];

                p.x += p.vx;
                p.y += p.vy;

                // Bounce off edges
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                // Draw particle
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                // Connect particles
                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p.x - p2.x;
                    let dy = p.y - p2.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(52, 152, 219, ${1 - distance / 120})`;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
