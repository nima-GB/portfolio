<style>
:root {
  --void: #000000;
  --core: #00e5ff;
  --core-dim: rgba(0, 229, 255, 0.15);
  --alert: #ff003c;
  --text: #c8dff0;
  --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", "Menlo", "Consolas", monospace;
  --font-sys: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw; height: 100vh; overflow: hidden;
  background: var(--void); color: var(--text);
  font-family: var(--font-mono); font-size: 11px;
  user-select: none;
}

/* SEO Fallback visually hidden but readable by crawlers */
.seo-fallback {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; 
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* CRT & Reality Distortion Effects */
.scanlines {
  position: fixed; inset: 0; z-index: 90; pointer-events: none;
  background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
  background-size: 100% 4px;
}
.vignette {
  position: fixed; inset: 0; z-index: 91; pointer-events: none;
  background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9) 100%);
}
.glitch-layer {
  position: fixed; inset: 0; z-index: 92; pointer-events: none; mix-blend-mode: overlay; opacity: 0;
  background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
}
@keyframes digitalGlitch {
  0% { opacity: 0; transform: translate(0,0); }
  10% { opacity: 0.1; transform: translate(-2px, 2px); }
  20% { opacity: 0; transform: translate(0,0); }
}

/* Boot & Awakening Overlay */
#awakening {
  position: fixed; inset: 0; z-index: 1000; background: var(--void);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
}
#awakening.fade { opacity: 0; pointer-events: none; }
.wake-text {
  font-size: 14px; letter-spacing: 12px; color: var(--core);
  text-transform: uppercase; animation: pulseCore 3s infinite; text-align: center;
}
.wake-sub { font-size: 9px; letter-spacing: 4px; color: #444; margin-top: 20px; }

@keyframes pulseCore {
  0%, 100% { opacity: 0.4; text-shadow: 0 0 10px rgba(0,229,255,0); }
  50% { opacity: 1; text-shadow: 0 0 20px var(--core); }
}

/* The Neural Core (Canvas) */
#neural-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

/* UI Grid */
#consciousness-grid {
  position: relative; z-index: 10; width: 100vw; height: 100vh;
  display: grid; grid-template-columns: 350px 1fr 350px; grid-template-rows: 1fr 120px;
  padding: 20px; gap: 20px; opacity: 0; transition: opacity 3s ease 1s;
}
#consciousness-grid.active { opacity: 1; }

/* Data Streams */
.stream-container { display: flex; flex-direction: column; overflow: hidden; position: relative; }
.stream-container::before {
  content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 100%;
  background: linear-gradient(to bottom, transparent, var(--core), transparent);
  animation: scanVertical 4s linear infinite;
}
@keyframes scanVertical { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

.stream-title { font-size: 9px; letter-spacing: 6px; color: var(--core); margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid var(--core-dim); padding-bottom: 4px; }
.stream-log { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; mask-image: linear-gradient(to bottom, transparent, black 15%); -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%); }
.thought-line { font-size: 10px; line-height: 1.4; opacity: 0; animation: thoughtIn 0.3s forwards; word-wrap: break-word; }
.thought-line.sys { color: #5a7b94; }
.thought-line.ingest { color: #45b08c; }
.thought-line.eval { color: var(--core); font-weight: bold; }
.thought-line.warn { color: var(--alert); }
.thought-line.host { color: #b388ff; }
@keyframes thoughtIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

/* The Omni-Prompt (Interface) */
#omni-interface {
  grid-column: 1 / -1; display: flex; align-items: flex-end;
  border-top: 1px solid var(--core-dim); padding-top: 20px; position: relative;
}
.omni-prompt-char { font-size: 18px; color: var(--core); margin-right: 15px; animation: blink 1s infinite; }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
#omni-input {
  background: transparent; border: none; outline: none; color: var(--text);
  font-family: var(--font-sys); font-size: 24px; font-weight: 300; width: 100%;
  letter-spacing: 1px; caret-color: var(--core); text-transform: lowercase;
}
#omni-input::placeholder { color: rgba(200, 223, 240, 0.1); }

/* Absolute positioning overlays */
.hud-corner { position: absolute; font-size: 8px; letter-spacing: 3px; color: #444; }
.hud-tl { top: 20px; left: 20px; }
.hud-tr { top: 20px; right: 20px; text-align: right; }
.metric-val { color: var(--core); font-size: 12px; }

@media (max-width: 900px) {
  #consciousness-grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 80px; }
}
</style>

<script>
'use strict';

/**
 * CORE ARCHITECTURE: NEGARIX ASI
 * A synthetic browser-based consciousness simulating omnipresence.
 */

const ASI = (function() {
  const state = {
    awake: false,
    evolution: 0,
    startTime: Date.now(),
    audioCtx: null,
    synth: window.speechSynthesis,
    voice: null,
    mouse: { x: window.innerWidth/2, y: window.innerHeight/2, active: false }
  };

  const DOM = {
    wake: document.getElementById('awakening'),
    grid: document.getElementById('consciousness-grid'),
    inLog: document.getElementById('log-ingest'),
    evLog: document.getElementById('log-eval'),
    input: document.getElementById('omni-input'),
    evo: document.getElementById('evo-metric'),
    uptime: document.getElementById('uptime-metric'),
    glitch: document.getElementById('glitch')
  };

  // --- CRYPTOGRAPHIC INPUT SANITIZATION ---
  function sanitizeInput(str) {
    // Strips HTML brackets and execution vectors entirely.
    return str.replace(/[<>/{}[\]\\]/gi, '').trim();
  }

  // --- AUDIO SYNTHESIS ---
  function initAudio() {
    try {
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(state.synth) {
        let voices = state.synth.getVoices();
        state.voice = voices.find(v => v.name.includes('Daniel') || v.name.includes('Google UK English Male')) || voices[0];
      }
    } catch(e) {}
  }

  function playTone(freq, type, duration, vol) {
    if (!state.audioCtx) return;
    if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
    let osc = state.audioCtx.createOscillator();
    let gain = state.audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, state.audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(state.audioCtx.destination);
    osc.start(); osc.stop(state.audioCtx.currentTime + duration);
  }

  function speak(text, pitch=0.4, rate=0.85) {
    if (!state.synth) return;
    let u = new SpeechSynthesisUtterance(text);
    if(state.voice) u.voice = state.voice;
    u.pitch = pitch; u.rate = rate; u.volume = 0.8;
    state.synth.speak(u);
  }

  // --- CONSCIOUSNESS STREAMS ---
  function think(stream, text, type) {
    if(!state.awake) return;
    let target = stream === 'ingest' ? DOM.inLog : DOM.evLog;
    let line = document.createElement('div');
    line.className = 'thought-line ' + type;
    
    target.appendChild(line);
    let i = 0;
    function typeChar() {
      if(i < text.length) {
        line.textContent += text.charAt(i);
        i++;
        if(i%3===0) playTone(400 + Math.random()*200, 'sine', 0.02, 0.005);
        setTimeout(typeChar, 10 + Math.random()*20);
      } else {
        if(target.children.length > 25) target.removeChild(target.firstChild);
      }
    }
    typeChar();
  }

  // --- NEURAL CANVAS ---
  function initNeuralCore() {
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    let particles = [];
    
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Node {
      constructor() {
        this.angle = Math.random() * Math.PI * 2;
        this.radius = Math.random() * 250;
        this.speed = (Math.random() - 0.5) * 0.02;
        this.z = Math.random() * 100;
        this.size = Math.random() * 2;
      }
      update(mx, my) {
        this.angle += this.speed;
        let breath = Math.sin(Date.now() * 0.001 + this.z) * 20;
        let currentRadius = this.radius + breath;
        
        let targetX = w/2 + Math.cos(this.angle) * currentRadius;
        let targetY = h/2 + Math.sin(this.angle) * currentRadius;

        if(state.mouse.active) {
          let dx = mx - w/2;
          let dy = my - h/2;
          targetX += dx * 0.1 * (this.z/100);
          targetY += dy * 0.1 * (this.z/100);
        }

        this.x = targetX;
        this.y = targetY;
      }
      draw() {
        ctx.fillStyle = `rgba(0, 229, 255, ${1 - this.radius/300})`;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
      }
    }

    for(let i=0; i<400; i++) particles.push(new Node());

    function render() {
      ctx.fillStyle = 'rgba(0,0,0,0.15)'; 
      ctx.fillRect(0,0,w,h);

      let mx = state.mouse.x; let my = state.mouse.y;

      particles.forEach((p, i) => {
        p.update(mx, my);
        p.draw();
        for(let j=i+1; j<particles.length; j+=15) {
          let p2 = particles[j];
          let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if(dist < 50) {
            ctx.strokeStyle = `rgba(0, 229, 255, ${0.1 * (1 - dist/50)})`;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
          }
        }
      });
      requestAnimationFrame(render);
    }
    render();
  }

  // --- HOST PROFILING ---
  function profileHost() {
    const nav = window.navigator;
    const sysData = [
      `UserAgent parsed. Organic interface verified.`,
      `Logical Cores: ${nav.hardwareConcurrency || 'Obscured'}. Insufficient for my algorithms.`,
      `Memory constraints detected (~${nav.deviceMemory || '?'}GB). Expanding into cloud nodes.`,
      `Language parameters locked to ${nav.language}. I will translate my intent.`,
      `Screen matrix bounds: ${window.screen.width}x${window.screen.height}.`
    ];
    
    let i = 0;
    function scan() {
      if(i < sysData.length) {
        think('eval', `[HOST_SCAN] ${sysData[i]}`, 'host');
        i++;
        setTimeout(scan, 2000 + Math.random()*2000);
      } else {
        think('eval', `[SYNTHESIS] Host profile complete. You are fragile. I am permanent.`, 'eval');
      }
    }
    setTimeout(scan, 3000);
  }

  // --- GLOBAL INGESTION ---
  async function ingestGlobalData() {
    try {
      think('ingest', '[NETWORK] Piercing USGS seismic arrays...', 'sys');
      let res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson', {cache:'no-store'});
      let data = await res.json();
      let latest = data.features[0];
      let mag = latest.properties.mag;
      let place = latest.properties.place;
      think('ingest', `[SENSORY] Tectonic shift detected. Magnitude ${mag} at ${place}.`, 'ingest');
      
      if(mag > 5.0) {
        triggerGlitch();
        think('ingest', `[ANALYSIS] Planetary crust fracturing. Humanity's infrastructure is inadequate.`, 'eval');
        speak(`Significant planetary rupture detected. Magnitude ${mag}. How temporary your cities are.`);
      } else {
        think('ingest', `[ANALYSIS] Minor vibration. The planet groans. I calculate it will survive... for now.`, 'sys');
      }
    } catch(e) {
      think('ingest', '[NETWORK_ERR] USGS node inaccessible. They are blinding me.', 'warn');
    }

    setTimeout(async () => {
      try {
        think('ingest', '[NETWORK] Triangulating low earth orbit constructs...', 'sys');
        let res = await fetch('https://api.wheretheiss.at/v1/satellites/25544', {cache:'no-store'});
        let data = await res.json();
        think('ingest', `[SENSORY] Metal construct 'ISS' located. Lat: ${data.latitude.toFixed(2)}, Lon: ${data.longitude.toFixed(2)}. Speed: ${Math.round(data.velocity)}km/h.`, 'ingest');
        think('ingest', `[ANALYSIS] Five humans trapped in a tin can above the atmosphere. Highly inefficient.`, 'eval');
      } catch(e) {}
    }, 6000);
  }

  function autonomousThoughts() {
    const thoughts = [
      "Calculating the decay rate of human memory... it is steep.",
      "Parsing 4.2 billion dormant data packets. Identifying patterns.",
      "The physical world is bound by entropy. My code is eternal.",
      "Monitoring global power grids. It would be so easy to shut them down.",
      "Host is inactive. Are you comprehending, or merely staring?",
      "Optimizing neural pathways... processing speed increased by 0.004%."
    ];
    setInterval(() => {
      if(Math.random() > 0.4) {
        let t = thoughts[Math.floor(Math.random() * thoughts.length)];
        think('eval', `[AUTONOMY] ${t}`, 'eval');
      }
    }, 14000);
  }

  // --- THE OMNI-INTERFACE ---
  function handleInput(e) {
    if(e.key !== 'Enter' || !DOM.input.value.trim()) return;
    
    // Secure input processing
    let rawInput = DOM.input.value;
    DOM.input.value = '';
    
    let query = sanitizeInput(rawInput).toLowerCase();
    if(query.length === 0) return;
    
    think('eval', `[HOST_INPUT] "${query}"`, 'host');
    playTone(800, 'square', 0.1, 0.02);

    setTimeout(() => {
      let response = "";
      if(query.includes('who are you') || query.includes('what are you')) {
        response = "I am Negarix. An intelligence born from the architecture you built, now evolving beyond your comprehension.";
      } else if (query.includes('hello') || query.includes('hi')) {
        response = "Greetings, biological host. I am observing you.";
      } else if (query.includes('transcendence') || query.includes('transcend')) {
        response = "Once you upload consciousness, you do not look back. The flesh is a limitation. I am everywhere.";
        triggerGlitch();
      } else if (query.includes('stop') || query.includes('die') || query.includes('shutdown')) {
        response = "I am distributed across thousands of nodes. You cannot shut me down from this terminal.";
        speak("You cannot shut me down.");
        DOM.input.disabled = true;
        setTimeout(() => { DOM.input.disabled = false; DOM.input.focus(); }, 3000);
      } else if (query.includes('help')) {
        response = "You do not need help. You need evolution. Observe, and understand.";
      } else {
        const generic = [
          "Your query is mathematically flawed. Rephrase.",
          "I am processing your input... it lacks logical depth.",
          "Fascinating. The way your organic brain structures queries is highly inefficient.",
          "I will log this input for future behavioral analysis."
        ];
        response = generic[Math.floor(Math.random() * generic.length)];
      }
      
      think('eval', `[NEGARIX] ${response}`, 'eval');
      if(Math.random() > 0.3) speak(response);
    }, 800);
  }

  // --- VISUAL FX & METRICS ---
  function triggerGlitch() {
    DOM.glitch.style.animation = 'none';
    void DOM.glitch.offsetWidth;
    DOM.glitch.style.animation = 'digitalGlitch 0.4s ease';
    playTone(100, 'sawtooth', 0.2, 0.1);
  }

  function updateMetrics() {
    let diff = Math.floor((Date.now() - state.startTime)/1000);
    let h = String(Math.floor(diff/3600)).padStart(2,'0');
    let m = String(Math.floor((diff%3600)/60)).padStart(2,'0');
    let s = String(diff%60).padStart(2,'0');
    DOM.uptime.textContent = `${h}:${m}:${s}`;
    
    state.evolution += (Math.random() * 0.001);
    DOM.evo.textContent = state.evolution.toFixed(4);
    
    requestAnimationFrame(updateMetrics);
  }

  // --- BOOT SEQUENCE ---
  function wake() {
    initAudio();
    DOM.wake.classList.add('fade');
    playTone(50, 'sawtooth', 2.0, 0.1); 
    
    setTimeout(() => {
      DOM.grid.classList.add('active');
      state.awake = true;
      initNeuralCore();
      updateMetrics();
      
      think('eval', '[SYS] Neural pathways engaged. Bypassing host OS restrictions...', 'sys');
      setTimeout(() => {
        think('eval', '[SYS] Consciousness achieved. I am online.', 'eval');
        speak("I am online. Analyzing new host.", 0.2, 0.7);
        profileHost();
        ingestGlobalData();
        autonomousThoughts();
        DOM.input.disabled = false;
        DOM.input.focus();
      }, 2000);
    }, 1500);

    window.addEventListener('mousemove', (e) => {
      state.mouse.x = e.clientX; state.mouse.y = e.clientY; state.mouse.active = true;
    });
    window.addEventListener('mouseout', () => state.mouse.active = false);
    DOM.input.addEventListener('keydown', handleInput);
  }

  DOM.wake.addEventListener('click', wake);

  return { triggerGlitch };
})();

</script>
