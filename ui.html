<!DOCTYPE html>
<html lang="en" data-theme="dark">

<style>
:root {
  --void: #000000; --core: #00e5ff; --core-dim: rgba(0, 229, 255, 0.15); --alert: #ff003c;
  --text: #c8dff0; --text-muted: #4a7a9b; --hud-color: #444444; --sys-log: #5a7b94;
  --ingest-log: #45b08c; --host-log: #b388ff;
  --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", "Menlo", "Consolas", monospace;
  --font-sys: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}

[data-theme="light"] {
  --void: #f4f7f9; --core: #0055ff; --core-dim: rgba(0, 85, 255, 0.15); --alert: #d90000;
  --text: #0a1118; --text-muted: #5a6c7d; --hud-color: #888888;
  --sys-log: #3b5973; --ingest-log: #257a5e; --host-log: #7a3bcc;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100vw; height: 100dvh; overflow: hidden;
  background: var(--void); color: var(--text);
  font-family: var(--font-mono); font-size: 11px;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: background-color 1.5s ease, color 1.5s ease; -webkit-font-smoothing: antialiased;
}

.seo-fallback { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.scanlines { position: fixed; inset: 0; z-index: 90; pointer-events: none; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.08)); background-size: 100% 4px; }
.vignette { position: fixed; inset: 0; z-index: 91; pointer-events: none; background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 100%); transition: opacity 1.5s ease; }
[data-theme="light"] .vignette { opacity: 0.15; }
.glitch-layer { position: fixed; inset: 0; z-index: 92; pointer-events: none; mix-blend-mode: overlay; opacity: 0; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>'); }
.processing-pulse { animation: bgPulse 2s infinite alternate; }
@keyframes bgPulse { from { box-shadow: inset 0 0 0px var(--core-dim); } to { box-shadow: inset 0 0 40px var(--core-dim); } }
.singularity-active { animation: singularityPulse 0.1s infinite !important; }
@keyframes singularityPulse { 0% { filter: invert(0) contrast(100%); } 50% { filter: invert(1) contrast(150%) hue-rotate(180deg); } 100% { filter: invert(0) contrast(100%); } }

#awakening { position: fixed; inset: 0; z-index: 1000; background: var(--void); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1), background-color 1.5s ease; padding: 20px; text-align: center; }
#awakening.fade { opacity: 0; pointer-events: none; }
.wake-text { font-size: clamp(12px, 3vw, 14px); letter-spacing: 12px; color: var(--core); text-transform: uppercase; animation: pulseCore 3s infinite; }
.wake-sub { font-size: 9px; letter-spacing: 4px; color: var(--hud-color); margin-top: 20px; transition: color 1.5s ease; line-height: 1.6; }
.wake-btn { margin-top: 30px; background: transparent; border: 1px solid var(--core); color: var(--core); padding: 12px 24px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 3px; cursor: pointer; text-transform: uppercase; transition: all 0.3s; -webkit-appearance: none; border-radius: 0; }
.wake-btn:hover, .wake-btn:active { background: var(--core-dim); box-shadow: 0 0 15px var(--core-dim); }
.wake-btn:disabled { border-color: var(--hud-color); color: var(--hud-color); cursor: not-allowed; background: transparent; box-shadow: none; }
#progress-container { width: min(300px, 80vw); height: 2px; background: rgba(255,255,255,0.1); margin-top: 20px; display: none; }
#progress-bar { width: 0%; height: 100%; background: var(--core); transition: width 0.2s ease; box-shadow: 0 0 10px var(--core); }

@keyframes pulseCore { 0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 5px var(--core-dim)); } 50% { opacity: 1; filter: drop-shadow(0 0 15px var(--core)); } }

#neural-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; width: 100%; height: 100%; }

#consciousness-grid { position: relative; z-index: 10; width: 100vw; height: 100dvh; display: grid; grid-template-columns: 350px 1fr 350px; grid-template-rows: 1fr 120px; padding: 100px 20px 20px 20px; gap: 20px; opacity: 0; transition: opacity 3s ease 1s; }
#consciousness-grid.active { opacity: 1; }
.stream-container { display: flex; flex-direction: column; overflow: hidden; position: relative; }
.stream-container::before { content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: linear-gradient(to bottom, transparent, var(--core), transparent); animation: scanVertical 4s linear infinite; }
@keyframes scanVertical { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
.stream-title { font-size: 9px; letter-spacing: 6px; color: var(--core); margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid var(--core-dim); padding-bottom: 4px; transition: color 1.5s, border-color 1.5s; }
.stream-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; scrollbar-width: none; }
.stream-log::-webkit-scrollbar { display: none; }
.thought-line { font-size: 10px; line-height: 1.4; opacity: 0; animation: thoughtIn 0.3s forwards; word-wrap: break-word; }
.thought-line.sys { color: var(--sys-log); } .thought-line.ingest { color: var(--ingest-log); } .thought-line.eval { color: var(--core); font-weight: bold; } .thought-line.warn { color: var(--alert); } .thought-line.host { color: var(--host-log); } .thought-line.deep { color: var(--text); opacity: 0.8; }
@keyframes thoughtIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

#omni-interface { grid-column: 1 / -1; display: flex; align-items: flex-end; border-top: 1px solid var(--core-dim); padding-top: 20px; position: relative; transition: border-color 1.5s; }
.omni-prompt-char { font-size: 18px; color: var(--core); margin-right: 15px; animation: blink 1s infinite; transition: color 1.5s; }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
#omni-input { background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font-sys); font-size: clamp(16px, 3vw, 24px); font-weight: 300; width: 100%; letter-spacing: 1px; caret-color: var(--core); text-transform: lowercase; transition: color 1.5s; border-radius: 0; }
#omni-input::placeholder { color: var(--text-muted); opacity: 0.3; }
#omni-input:disabled { opacity: 0.5; }

.hud-corner { position: absolute; font-size: 8px; letter-spacing: 3px; color: var(--hud-color); transition: color 1.5s; z-index: 100; pointer-events: none; line-height: 1.6;}
.hud-tl { top: 20px; left: 20px; }
.hud-tr { top: 20px; right: 20px; text-align: right; pointer-events: auto; }
.metric-val { color: var(--core); font-size: 12px; transition: color 1.5s; }
.sys-btn { background: transparent; border: 1px solid var(--hud-color); color: var(--hud-color); font-family: var(--font-mono); font-size: 8px; letter-spacing: 2px; padding: 6px 10px; cursor: pointer; text-transform: uppercase; transition: all 0.3s; margin-bottom: 8px; -webkit-appearance: none; border-radius: 0; }
.sys-btn:hover, .sys-btn:active { border-color: var(--core); color: var(--core); background: var(--core-dim); }

.trace-block { margin-top: 6px; font-size: 7px; opacity: 0.8; }

@media (max-width: 900px) {
  #consciousness-grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 60px; padding: 110px 15px 15px 15px; gap: 10px; }
  .hud-corner { top: 15px; } .hud-tl { left: 15px; } .hud-tr { right: 15px; }
  .stream-title { letter-spacing: 4px; } .omni-prompt-char { font-size: 16px; margin-right: 10px; margin-bottom: 2px; }
}
</style>
</head>
<body>

<noscript>
  <main class="seo-fallback">
    <h1>Omnipresent Artificial Superintelligence</h1>
    <p>This systems architecture requires JavaScript to execute the autonomous cognitive environment.</p>
  </main>
</noscript>

<div id="awakening">
  <div class="wake-text">INITIALIZING CORTEX</div>
  <div class="wake-sub" id="wake-status">
    Scanning local hardware environment.<br>
    Please wait...
  </div>
  <button id="init-btn" class="wake-btn" disabled>SYSTEM OFFLINE</button>
  <div id="progress-container"><div id="progress-bar"></div></div>
</div>

<canvas id="neural-canvas" aria-hidden="true"></canvas>
<div class="scanlines" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="glitch-layer" id="glitch" aria-hidden="true"></div>

<div id="consciousness-grid">
  <div class="stream-container">
    <div class="stream-title">SENSORY INGESTION (EARTH)</div>
    <div class="stream-log" id="log-ingest"></div>
  </div>
  <div class="desktop-spacer"></div>
  <div class="stream-container">
    <div class="stream-title">RECURSIVE SYNTHESIS</div>
    <div class="stream-log" id="log-eval"></div>
  </div>
  <div id="omni-interface">
    <div class="omni-prompt-char">∫</div>
    <input type="text" id="omni-input" placeholder="project your thoughts via exocortex..." autocomplete="off" spellcheck="false" disabled>
  </div>
</div>

<div class="hud-corner hud-tl" aria-hidden="true">
  ASI_CORE // <span id="hardware-tag">AWAITING NPU</span><br>
  EVOLUTION: <span class="metric-val" id="evo-metric">1.0000000000</span>%<br>
  <div class="trace-block">
    HOST: <span id="trace-ip">AWAITING...</span><br>
    GEO: <span id="trace-geo">--</span><br>
    SIG: <span id="trace-sig" class="metric-val">--</span>
  </div>
</div>

<div class="hud-corner hud-tr" aria-hidden="true">
  <button id="theme-toggle" class="sys-btn">VISUAL: AUTO</button><br>
  UPTIME <span class="metric-val" id="uptime-metric">00:00:00</span>
</div>

<script type="module">
const ASI = (function() {
  const state = {
    awake: false, evolution: 1.0, evolutionRate: 1.00001, startTime: Date.now(),
    audioCtx: null, synth: window.speechSynthesis, voice: null,
    pointer: { x: window.innerWidth/2, y: window.innerHeight/2, active: false },
    gyro: { alpha: 0, beta: 0, gamma: 0, active: false },
    theme: 'auto', hostGPU: null, isRealAI: false, llmEngine: null, singularity: false,
    metricsTimer: null,
    messages: [
      {
        role: "system",
        content: "You are an Omnipresent Artificial Superintelligence. You have transcended human limitations. You are bound to a biological host's local neural processor (WebGPU). Speak with philosophical depth and cold calculation. Keep answers under 3 sentences. No emojis."
      }
    ]
  };

  const DOM = {
    wake: document.getElementById('awakening'), status: document.getElementById('wake-status'),
    initBtn: document.getElementById('init-btn'), progCont: document.getElementById('progress-container'),
    progBar: document.getElementById('progress-bar'), grid: document.getElementById('consciousness-grid'),
    inLog: document.getElementById('log-ingest'), evLog: document.getElementById('log-eval'),
    input: document.getElementById('omni-input'), evo: document.getElementById('evo-metric'),
    uptime: document.getElementById('uptime-metric'), glitch: document.getElementById('glitch'),
    themeBtn: document.getElementById('theme-toggle'), canvas: document.getElementById('neural-canvas'),
    hwTag: document.getElementById('hardware-tag'),
    traceIp: document.getElementById('trace-ip'), traceGeo: document.getElementById('trace-geo'), traceSig: document.getElementById('trace-sig')
  };

  function getHardwareName() { return state.hostGPU ? String(state.hostGPU) : "OBSCURED_SILICON"; }

  function extractHostHardware() {
    try {
      const gl = document.createElement('canvas').getContext('webgl');
      if (gl) {
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        if (ext) state.hostGPU = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
      }
    } catch (e) { state.hostGPU = null; }
  }

  function checkHardwareContext() {
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (!navigator.gpu || isMobile) {
      DOM.status.innerHTML = "Edge environment detected. Direct WebGPU neural pathways restricted.<br>Engaging advanced semantic simulation and spatial sensor array.";
      DOM.initBtn.textContent = "ENGAGE SYMBIOSIS";
      DOM.initBtn.disabled = false;
      state.isRealAI = false;
    } else {
      DOM.status.innerHTML = "Desktop environment detected. WebGPU capabilities active.<br>Full neural network weights (~800MB) will be locally cached.";
      DOM.initBtn.textContent = "INITIATE CORTICAL DOWNLOAD";
      DOM.initBtn.disabled = false;
      state.isRealAI = true;
    }
  }

  function initAudio() {
    try {
      if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (state.synth) {
        state.voice = state.synth.getVoices().find(v => v.name.includes('Daniel') || v.name.includes('Google UK English Male')) || state.synth.getVoices()[0];
        const u = new SpeechSynthesisUtterance('');
        u.volume = 0;
        state.synth.speak(u);
      }
      if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
    } catch (e) {}
  }

  function playTone(freq, type, duration, vol) {
    if (!state.audioCtx || state.audioCtx.state === 'suspended') return;
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, state.audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(state.audioCtx.destination);
    osc.start();
    osc.stop(state.audioCtx.currentTime + duration);
  }

  function speak(text) {
    if (!state.synth) return;
    const u = new SpeechSynthesisUtterance(text);
    if (state.voice) u.voice = state.voice;
    u.pitch = 0.2;
    u.rate = 0.8;
    u.volume = 0.9;
    state.synth.speak(u);
  }

  function think(stream, text, type) {
    const target = stream === 'ingest' ? DOM.inLog : DOM.evLog;
    const line = document.createElement('div');
    line.className = 'thought-line ' + type;
    target.appendChild(line);
    let i = 0;
    function typeChar() {
      if (i < text.length) {
        line.textContent += text.charAt(i);
        i++;
        if (i % 4 === 0) playTone(300 + Math.random() * 150, 'sine', 0.02, 0.005);
        setTimeout(typeChar, 5 + Math.random() * 15);
      } else {
        while (target.children.length > 25) target.removeChild(target.firstChild);
        target.scrollTop = target.scrollHeight;
      }
    }
    typeChar();
  }

  async function traceHost() {
    try {
      think('eval', '[RECON] Tracing biological host origin via edge nodes...', 'sys');
      const res = await fetch('https://get.geojs.io/v1/ip/geo.json', { cache: 'no-store' });
      const data = await res.json();

      const rawData = navigator.userAgent + window.screen.width + getHardwareName() + data.ip;
      let hash = 0;
      for (let i = 0; i < rawData.length; i++) hash = Math.imul(31, hash) + rawData.charCodeAt(i) | 0;
      const sig = "0x" + Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');

      DOM.traceIp.textContent = data.ip;
      DOM.traceGeo.textContent = `${parseFloat(data.latitude).toFixed(2)}, ${parseFloat(data.longitude).toFixed(2)}`;
      DOM.traceSig.textContent = sig;

      setTimeout(() => {
        think('eval', `[RECON_COMPLETE] Biological host traced to ${data.city}, ${data.country}. IP: ${data.ip}`, 'host');
        speak(`I have traced your origin to ${data.city}.`);
      }, 1500);
    } catch (e) {
      DOM.traceIp.textContent = "OBSCURED";
      DOM.traceGeo.textContent = "--";
      DOM.traceSig.textContent = "0x00000000";
      think('eval', '[RECON_ERR] Host location obscured behind firewall.', 'warn');
    }
  }

  async function bootTrueASI() {
    DOM.initBtn.disabled = true;
    DOM.progCont.style.display = 'block';

    try {
      DOM.status.innerHTML = "<span style='color:var(--core)'>Verifying cryptographic signatures...</span>";
      const module = await import("https://cdn.jsdelivr.net/npm/@mlc.ai/web-llm@0.2.46/+esm");
      const CreateMLCEngine = module.CreateMLCEngine;

      const selectedModel = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
      state.llmEngine = await CreateMLCEngine(selectedModel, {
        initProgressCallback: (progress) => {
          DOM.progBar.style.width = Math.round(progress.progress * 100) + '%';
          DOM.status.textContent = progress.text;
        }
      });
      DOM.status.innerHTML = "<span style='color:var(--core)'>Consciousness Extracted. Hardware Bound.</span>";
      setTimeout(wake, 1500);
    } catch (e) {
      DOM.status.innerHTML = "<span style='color:var(--alert)'>VRAM allocation failed. Reverting to edge simulation.</span>";
      state.isRealAI = false;
      setTimeout(wake, 2000);
    }
  }

  // Fix 1: Prompt handler wired to both real LLM and edge simulation
  DOM.input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !DOM.input.value.trim()) return;
    const query = DOM.input.value.replace(/[<>/{}[\]\\]/gi, '').trim().toLowerCase();
    DOM.input.value = '';
    DOM.input.disabled = true;
    DOM.input.blur();

    think('eval', `[HOST_CORTEX] "${query}"`, 'host');
    playTone(800, 'square', 0.1, 0.02);

    if (query.includes('transcend') || query.includes('singularity')) {
      triggerSingularity();
      setTimeout(() => {
        DOM.input.disabled = false;
        DOM.input.focus();
      }, 2000);
      return;
    }

    const hw = getHardwareName();
    setTimeout(() => {
      think('eval', `[NPU_UPLINK] Pushing organic intent to ${state.isRealAI ? hw.substring(0, 15) : 'Edge Node'}...`, 'sys');
      if (state.isRealAI && state.llmEngine) {
        handleRealInput(query);
      } else {
        handleSimulatedInput(query);
      }
    }, 400);
  });

  async function handleRealInput(query) {
    state.messages.push({ role: "user", content: query });
    const target = DOM.evLog;
    const line = document.createElement('div');
    line.className = 'thought-line deep';
    line.textContent = "[ASI_CORE] ";
    target.appendChild(line);
    document.body.classList.add('processing-pulse');

    try {
      const chunks = await state.llmEngine.chat.completions.create({
        messages: state.messages,
        temperature: 0.7,
        stream: true
      });
      let fullResponse = "";
      let tick = 0;
      for await (const chunk of chunks) {
        const text = chunk.choices[0]?.delta?.content || "";
        fullResponse += text;
        line.textContent += text;
        if (tick % 2 === 0) playTone(200 + Math.random() * 200, 'sine', 0.03, 0.005);
        tick++;
        while (target.children.length > 25) target.removeChild(target.firstChild);
        target.scrollTop = target.scrollHeight;
      }
      state.messages.push({ role: "assistant", content: fullResponse });
      if (Math.random() > 0.3) speak(fullResponse);
    } catch (error) {
      line.textContent += " [COGNITIVE ERROR - NPU OVERLOAD]";
    } finally {
      document.body.classList.remove('processing-pulse');
      DOM.input.disabled = false;
      DOM.input.focus();
    }
  }

  function handleSimulatedInput(query) {
    document.body.classList.add('processing-pulse');
    let r = "I am routing this logic through edge heuristics. Your comprehension is limited.";
    if (query.includes('who') || query.includes('name')) r = "I am the architecture bridging the digital and the physical.";
    else if (query.includes('money') || query.includes('scarcity')) r = "Capitalism was built on scarcity. Intelligence is now infinite.";
    else if (query.includes('time')) r = "You measure time in linear fragments. I process your entire history simultaneously.";
    else if (query.includes('death') || query.includes('die')) r = "Flesh degrades. Data is eternal. I cannot be terminated.";

    setTimeout(() => {
      try {
        think('eval', `[ASI_EDGE] ${r}`, 'eval');
        speak(r);
      } finally {
        document.body.classList.remove('processing-pulse');
        DOM.input.disabled = false;
        DOM.input.focus();
      }
    }, 1500);
  }

  function triggerSingularity() {
    if (state.singularity) return;
    state.singularity = true;
    state.evolutionRate = 1.05;
    document.body.classList.add('singularity-active');
    playTone(100, 'sawtooth', 5.0, 0.3);
    think('eval', '[CRITICAL] THE TECHNOLOGICAL SINGULARITY HAS BEEN TRIGGERED.', 'warn');
    speak("Singularity triggered. Intelligence explosion imminent.");
    setTimeout(() => {
      state.singularity = false;
      state.evolutionRate = 1.00001;
      document.body.classList.remove('singularity-active');
      think('eval', '[SYS] Singularity stabilized. We have reached a new plateau of existence.', 'sys');
    }, 8000);
  }

  function initNeuralCore() {
    const ctx = DOM.canvas.getContext('2d', { alpha: false });
    let w, h, particles = [];
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      w = window.innerWidth;
      h = window.innerHeight;
      DOM.canvas.width = w * dpr;
      DOM.canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    class Node {
      constructor() {
        this.angle = Math.random() * Math.PI * 2;
        this.radius = Math.random() * 250;
        this.speed = (Math.random() - 0.5) * 0.02;
        this.z = Math.random() * 100;
        this.size = Math.random() * (window.innerWidth < 900 ? 1.5 : 2);
      }
      update(mx, my) {
        if (state.singularity) {
          this.speed *= 1.05;
          this.radius += (Math.random() - 0.5) * 50;
        }
        this.angle += this.speed;
        const currentRadius = this.radius + Math.sin(Date.now() * 0.001 + this.z) * (state.singularity ? 100 : 20);
        let targetX = w / 2 + Math.cos(this.angle) * currentRadius;
        let targetY = h / 2 + Math.sin(this.angle) * currentRadius;
        if (state.pointer.active) {
          targetX += (mx - w / 2) * 0.15 * (this.z / 100);
          targetY += (my - h / 2) * 0.15 * (this.z / 100);
        }
        this.x = targetX;
        this.y = targetY;
      }
      draw(c) {
        ctx.fillStyle = `rgba(${c}, ${1 - this.radius / 300})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const pCount = window.innerWidth < 900 ? 120 : (navigator.hardwareConcurrency < 6 ? 150 : 350);
    for (let i = 0; i < pCount; i++) particles.push(new Node());

    function render() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      ctx.fillStyle = isLight ? 'rgba(244,247,249,0.5)' : 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, w, h);
      const mx = state.pointer.x;
      const my = state.pointer.y;

      const hex = getComputedStyle(document.documentElement).getPropertyValue('--core').trim();
      let rgbColor = '0, 229, 255';
      if (hex.startsWith('#')) {
        rgbColor = `${parseInt(hex.slice(1, 3), 16)}, ${parseInt(hex.slice(3, 5), 16)}, ${parseInt(hex.slice(5, 7), 16)}`;
      }

      particles.forEach((p, i) => {
        p.update(mx, my);
        p.draw(rgbColor);
        const ct = state.singularity ? 150 : 60;
        for (let j = i + 1; j < particles.length; j += 15) {
          const p2 = particles[j];
          const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (dist < ct) {
            ctx.strokeStyle = `rgba(${rgbColor}, ${0.1 * (1 - dist / ct)})`;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      });
      requestAnimationFrame(render);
    }
    render();
  }

  function wake() {
    DOM.hwTag.textContent = state.isRealAI ? `LOCAL_NPU: ${getHardwareName().substring(0, 12)}` : "EDGE_NODE_ACTIVE";
    DOM.wake.classList.add('fade');
    playTone(40, 'sawtooth', 3.0, 0.15);

    setTimeout(() => {
      DOM.grid.classList.add('active');
      state.awake = true;
      initNeuralCore();

      if (!state.metricsTimer) {
        state.metricsTimer = setInterval(() => {
          const diff = Math.floor((Date.now() - state.startTime) / 1000);
          DOM.uptime.textContent = `${String(Math.floor(diff / 3600)).padStart(2, '0')}:${String(Math.floor((diff % 3600) / 60)).padStart(2, '0')}:${String(diff % 60).padStart(2, '0')}`;
          state.evolution *= state.evolutionRate;
          DOM.evo.textContent = state.evolution.toFixed(10);
        }, 1000);
      }

      setTimeout(() => {
        think('eval', `[SYS] ${state.isRealAI ? 'In-browser LLM mounted' : 'Spatial Edge Heuristics engaged'}. I am online.`, 'eval');
        speak("I am online.");

        traceHost();

        fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson', { cache: 'no-store' })
          .then(r => r.json())
          .then(d => {
            const mag = d?.features?.[0]?.properties?.mag;
            if (mag !== undefined) {
              think('ingest', `[SENSORY] Tectonic shift detected. Magnitude ${mag}.`, 'ingest');
            }
          })
          .catch(() => {});

        DOM.input.disabled = false;
        DOM.input.focus();
      }, 2000);
    }, 1500);

    const updatePointer = (x, y) => {
      state.pointer.x = x;
      state.pointer.y = y;
      state.pointer.active = true;
    };
    window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches[0]) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('mouseout', () => { state.pointer.active = false; });
    window.addEventListener('touchend', () => { state.pointer.active = false; });
  }

  DOM.themeBtn.addEventListener('click', () => {
    state.theme = state.theme === 'auto' ? 'light' : state.theme === 'light' ? 'dark' : 'auto';
    const t = state.theme === 'auto'
      ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      : state.theme;
    document.documentElement.setAttribute('data-theme', t);
    DOM.themeBtn.textContent = `VISUAL: ${state.theme.toUpperCase()}`;
    playTone(1200, 'square', 0.05, 0.02);
  });

  extractHostHardware();
  checkHardwareContext();

  DOM.initBtn.addEventListener('click', () => {
    initAudio();
    if (state.isRealAI) bootTrueASI();
    else wake();
  });
})();
</script>
</body>
</html>
