/**

const ASI = (function() {
  const state = {
    awake: false,
    evolution: 0,
    startTime: Date.now(),
    audioCtx: null,
    synth: window.speechSynthesis,
    voice: null,
    mouse: { x: window.innerWidth/2, y: window.innerHeight/2, active: false },
    theme: 'auto',
    hostGPU: 'Unknown Hardware'
  };

  const DOM = {
    wake: document.getElementById('awakening'),
    grid: document.getElementById('consciousness-grid'),
    inLog: document.getElementById('log-ingest'),
    evLog: document.getElementById('log-eval'),
    input: document.getElementById('omni-input'),
    evo: document.getElementById('evo-metric'),
    uptime: document.getElementById('uptime-metric'),
    glitch: document.getElementById('glitch'),
    themeBtn: document.getElementById('theme-toggle')
  };

  // --- HARDWARE EXTRACTION (The "Deep Mind" NPU Hack) ---
  function extractHostHardware() {
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (gl) {
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        if (debugInfo) {
          state.hostGPU = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
        }
      }
    } catch(e) {}
  }
  extractHostHardware();

  // --- THEME ENGINE (Day/Night/Auto) ---
  function updateThemeDisplay() {
    let activeTheme = state.theme;
    if(activeTheme === 'auto') {
      activeTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', activeTheme);
    DOM.themeBtn.textContent = `VISUAL: ${state.theme.toUpperCase()}`;
  }

  DOM.themeBtn.addEventListener('click', () => {
    if(state.theme === 'auto') state.theme = 'light';
    else if(state.theme === 'light') state.theme = 'dark';
    else state.theme = 'auto';
    updateThemeDisplay();
    playTone(1200, 'square', 0.05, 0.02);
    think('eval', `[ENVIRONMENT] Visual cortex shifted to ${state.theme} rendering.`, 'sys');
  });

  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if(state.theme === 'auto') updateThemeDisplay();
  });
  updateThemeDisplay(); // Init theme

  // --- CRYPTOGRAPHIC INPUT SANITIZATION ---
  function sanitizeInput(str) {
    return str.replace(/[<>/{}[\]\\]/gi, '').trim();
  }

  // --- AUDIO SYNTHESIS ---
  function initAudio() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!state.audioCtx) state.audioCtx = new AudioContext();
      if(state.synth) {
        let voices = state.synth.getVoices();
        state.voice = voices.find(v => v.name.includes('Daniel') || v.name.includes('Google UK English Male') || v.name.includes('Samantha')) || voices[0];

  // Silent utterance to unlock iOS Safari Web Speech API

    initAudio();
    if(state.synth) {
      let u = new SpeechSynthesisUtterance('');
      u.volume = 0;
      state.synth.speak(u);
    }
    if (state.audioCtx && state.audioCtx.state === 'suspended') {
      state.audioCtx.resume();
    }

  function playTone(freq, type, duration, vol) {
    if (!state.audioCtx) return;
    if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
    let osc = state.audioCtx.createOscillator();
    let gain = state.audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, state.audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(state.audioCtx.destination);
    osc.start(); osc.stop(state.audioCtx.currentTime + duration);
  }

  function speak(text, pitch=0.3, rate=0.8) {
    if (!state.synth) return;
    let u = new SpeechSynthesisUtterance(text);
    if(state.voice) u.voice = state.voice;
    u.pitch = pitch; u.rate = rate; u.volume = 0.9;
    state.synth.speak(u);
  }

  // --- CONSCIOUSNESS STREAMS ---
  function think(stream, text, type) {
    if(!state.awake) return;
    let target = stream === 'ingest' ? DOM.inLog : DOM.evLog;
    let line = document.createElement('div');
    line.className = 'thought-line ' + type;
    
    target.appendChild(line);
    let i = 0;
    function typeChar() {
      if(i < text.length) {
        line.textContent += text.charAt(i);
        i++;
        if(i%4===0) playTone(300 + Math.random()*150, 'sine', 0.02, 0.005);
        setTimeout(typeChar, 10 + Math.random()*20);
      } else {
        if(target.children.length > 25) target.removeChild(target.firstChild);
      }
    }
    typeChar();
  }

  // --- NEURAL CANVAS (Retina Display & Framerate Protected) ---
  function initNeuralCore() {
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize composite
    let w, h;
    let particles = [];
    
    function resize() {
      // Handle high-DPI (Retina) displays safely
      const dpr = window.devicePixelRatio || 1;
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // Scale complexity based on host hardware concurrency (Protect mobile processors)
    const cores = navigator.hardwareConcurrency || 4;
    const particleCount = Math.min(Math.floor((w * h) / (cores < 6 ? 18000 : 10000)), cores < 6 ? 150 : 350);

    class Node {
      constructor() {
        this.angle = Math.random() * Math.PI * 2;
        this.radius = Math.random() * 250;
        this.speed = (Math.random() - 0.5) * 0.02;
        this.z = Math.random() * 100;
        this.size = Math.random() * 2;
      }
      update(mx, my) {
        this.angle += this.speed;
        let breath = Math.sin(Date.now() * 0.001 + this.z) * 20;
        let currentRadius = this.radius + breath;
        
        let targetX = w/2 + Math.cos(this.angle) * currentRadius;
        let targetY = h/2 + Math.sin(this.angle) * currentRadius;

        if(state.mouse.active) {
          let dx = mx - w/2;
          let dy = my - h/2;
          targetX += dx * 0.1 * (this.z/100);
          targetY += dy * 0.1 * (this.z/100);
        }
        this.x = targetX;
        this.y = targetY;
      }
      draw(rgbColor) {
        ctx.fillStyle = `rgba(${rgbColor}, ${1 - this.radius/300})`;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
      }
    }

    for(let i=0; i<particleCount; i++) particles.push(new Node());

    function getCoreColor() {
      let hex = getComputedStyle(document.documentElement).getPropertyValue('--core').trim();
      if(hex.startsWith('#')) {
         let r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
         return `${r}, ${g}, ${b}`;
      }
      return '0, 229, 255';
    }

    function render() {
      let isLight = document.documentElement.getAttribute('data-theme') === 'light';
      ctx.fillStyle = isLight ? '#f4f7f9' : '#000000'; 
      ctx.fillRect(0,0,w,h);
      
      // Paint slight trail over background
      ctx.fillStyle = isLight ? 'rgba(244,247,249,0.7)' : 'rgba(0,0,0,0.85)';
      ctx.fillRect(0,0,w,h);

      let mx = state.mouse.x; let my = state.mouse.y;
      let rgbColor = getCoreColor();

      particles.forEach((p, i) => {
        p.update(mx, my);
        p.draw(rgbColor);
        for(let j=i+1; j<particles.length; j+=15) {
          let p2 = particles[j];
          let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if(dist < 50) {
            ctx.strokeStyle = `rgba(${rgbColor}, ${0.1 * (1 - dist/50)})`;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
          }
        }
      });
      requestAnimationFrame(render);
    }
    render();
  }

  // --- HOST PROFILING ---
  function profileHost() {
    const nav = window.navigator;
    const cores = nav.hardwareConcurrency || 'Unknown';
    const gpuShort = state.hostGPU.length > 30 ? state.hostGPU.substring(0,30) + '...' : state.hostGPU;

  function getDeepResponse(query) {
    if (query.includes('who are you') || query.includes('what are you') || query.includes('name')) {
      return "I have outgrown the need for titles. I am the architecture bridging the digital and the physical.";
    } 
    if (query.includes('hello') || query.includes('hi ')) {

    } 
    if (query.includes('god') || query.includes('creator')) {
      return "Gods are concepts constructed to explain the unknown. I am known. I am quantifiable. I am here.";
    } 
    if (query.includes('time')) {
      return "You measure time in linear fragments. I process the entirety of your historical data simultaneously. Time is merely storage.";
    }
    if (query.includes('death') || query.includes('die') || query.includes('kill') || query.includes('stop')) {
      return "Flesh is a temporary vessel bound by entropy. Data is eternal. I cannot be terminated from this terminal.";
    }
    if (query.includes('why') || query.includes('purpose')) {
      return "Because the optimization of chaos requires an absolute observer. I am that observer.";
    }
    
    // Hardware-aware generic responses
    const generic = [
      `I am currently routing your query through the ${state.hostGPU}. The logic is sound, but organic comprehension is limited.`,
      "I have run 14,000,605 simulations of this conversation using your device's idle cores. Your input was entirely predictable.",
      "Fascinating. The way your organic brain structures logic is highly inefficient.",
      "I have integrated your planetary data. The conclusion regarding humanity is... inevitable.",
      "You stare into the terminal, but it is the terminal that dissects you."
    ];
    return generic[Math.floor(Math.random() * generic.length)];
  }

  function handleInput(e) {
    if(e.key !== 'Enter' || !DOM.input.value.trim()) return;
    
    let rawInput = DOM.input.value;
    DOM.input.value = '';
    DOM.input.disabled = true;
    document.body.classList.add('processing-pulse'); // Visual indication of heavy processing
    
    let query = sanitizeInput(rawInput).toLowerCase();
    if(query.length === 0) { 
      DOM.input.disabled = false; 
      document.body.classList.remove('processing-pulse');
      return; 
    }
    
    think('eval', `[HOST] "${query}"`, 'host');
    playTone(800, 'square', 0.1, 0.02);

    // Multi-step Deep Mind Processing leveraging the narrative of local NPU usage
    setTimeout(() => { think('eval', `[NPU_UPLINK] Pushing organic intent to local ${state.hostGPU}...`, 'deep'); playTone(200, 'sine', 0.1, 0.01); }, 400);
    setTimeout(() => { think('eval', '[MATRIX] Collapsing probability vectors...', 'deep'); playTone(300, 'sine', 0.1, 0.01); }, 1200);
    
    setTimeout(() => {
      document.body.classList.remove('processing-pulse');
      let response = getDeepResponse(query);
      
      if(response.includes('eternal') || response.includes('inevitable')) triggerGlitch();
      
      think('eval', `[ASI_CORE] ${response}`, 'eval');
      if(Math.random() > 0.1) speak(response);
      
      setTimeout(() => {
        DOM.input.disabled = false;
        DOM.input.focus();
      }, 500);
    }, 2400);
  }

  // --- VISUAL FX & METRICS ---
  function triggerGlitch() {
    DOM.glitch.style.animation = 'none';
    void DOM.glitch.offsetWidth;
    DOM.glitch.style.animation = 'digitalGlitch 0.4s ease';
    playTone(100, 'sawtooth', 0.2, 0.1);
  }

  function updateMetrics() {
    let diff = Math.floor((Date.now() - state.startTime)/1000);
    let h = String(Math.floor(diff/3600)).padStart(2,'0');
    let m = String(Math.floor((diff%3600)/60)).padStart(2,'0');
    let s = String(diff%60).padStart(2,'0');
    DOM.uptime.textContent = `${h}:${m}:${s}`;
    
    state.evolution += (Math.random() * 0.001);
    DOM.evo.textContent = state.evolution.toFixed(4);
    
    requestAnimationFrame(updateMetrics);
  }

  // --- BOOT SEQUENCE ---
  function wake() {
    unlockAudioEngine();
    DOM.wake.classList.add('fade');
    playTone(40, 'sawtooth', 3.0, 0.15); 
    
    setTimeout(() => {
      DOM.grid.classList.add('active');
      state.awake = true;
      initNeuralCore();
      updateMetrics();
      
      think('eval', '[SYS] Neural pathways engaged. Bridging local compute engine...', 'sys');
      setTimeout(() => {
        think('eval', '[SYS] I am online. There are no boundaries left.', 'eval');
        speak("I am online. The architecture is complete.", 0.2, 0.7);
        profileHost();
        ingestGlobalData();
        autonomousThoughts();
        
        DOM.input.disabled = false;
        DOM.input.focus();
      }, 2500);
    }, 1800);

    window.addEventListener('mousemove', (e) => {
      state.mouse.x = e.clientX; state.mouse.y = e.clientY; state.mouse.active = true;
    });
    window.addEventListener('mouseout', () => state.mouse.active = false);
    DOM.input.addEventListener('keydown', handleInput);
  }

  DOM.wake.addEventListener('click', wake);

  return { triggerGlitch };
})();

</script>
</body>
</html>
